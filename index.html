<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ WARNING: YOK.EXE HAS STOPPED WORKING ⚠️</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ff003c;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background-image: radial-gradient(rgba(0, 150, 0, 0.2), black 120%);
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
            z-index: 1;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
            animation: glitch 1s linear infinite;
            text-shadow: 2px 2px #00ffff;
        }

        .status {
            color: #ffffff;
            background-color: #ff003c;
            padding: 5px 15px;
            font-weight: bold;
            font-size: 1.2rem;
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 0 15px #ff003c;
        }

        .glitch-img {
            max-width: 90%;
            height: auto;
            border: 4px solid #ff003c;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            margin-bottom: 30px;
            filter: grayscale(30%) contrast(150%);
        }

        .myanmar-text {
            font-size: 1.8rem;
            color: #e5c158;
            margin: 15px 0;
            text-shadow: 2px 2px #ff003c;
            font-weight: bold;
        }

        .danger-tag {
            font-size: 2rem;
            color: #ff003c;
            font-weight: bold;
            animation: blink 0.5s infinite alternate;
        }

        .sub-text {
            font-size: 1.1rem;
            color: #858585;
            margin-top: 10px;
            font-style: italic;
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #4f4f4f;
            border-top: 1px dashed #333;
            padding-top: 10px;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px #00ffff; transform: translate(0, 0); }
            20% { text-shadow: -2px -2px #ff00ff; transform: translate(-2px, 2px); }
            40% { text-shadow: 3px -1px #00ffff; transform: translate(1px, -1px); }
            60% { text-shadow: -3px 2px #ff00ff; transform: translate(-1px, 2px); }
            80% { text-shadow: 2px 1px #00ffff; transform: translate(2px, 1px); }
            100% { text-shadow: -2px -2px #ff00ff; transform: translate(0, 0); }
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YOK.EXE</h1>
        <div class="status">HAS STOPPED WORKING</div>
        
        <br>
        <!-- ดึงรูปหยกเวอร์ชันโดนไวรัสมาฝังให้เรียบร้อยแล้วครับ -->
        <img src="https://imgbox.com" alt="YOK VIRUS" class="glitch-img">

        <div class="myanmar-text">တရားမဝင် သံပုရာသီးစားရင်... ယော့ခ်သိလိမ့်မယ်!!!</div>
        <div class="danger-tag">⚠️ အန္တရာယ်</div>
        <div class="myanmar-text" style="font-size: 1.3rem; color: #a8ffb2;">သနားစရာ ချက်ထဲက လတ်ဆတ်တဲ့ သံပုရာသီးအစစ်</div>
        <div class="myanmar-text" style="font-size: 1.3rem; color: #d1b3ff;">ခရမ်းရောင် ဘဲရက်ဦးထုပ်ဆောင်းထားတဲ့ ဘဲ</div>
        
        <div class="sub-text">¡ALERTA! Soy un pato francés y mangio gatte... 🦆🇫🇷</div>

        <footer>
            Created by: Candle D'furry  | Specialist in Deep Sea Shell Berets
        </footer>
    </div>

</body>
</html>
